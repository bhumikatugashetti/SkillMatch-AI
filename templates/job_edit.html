<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job — SkillMatch AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- HEADER / NAVIGATION -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">⚡</div>
            <div class="logo">SkillMatch AI</div>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/jobs" class="active">Jobs</a>
            <a href="/upload">Resume Analysis</a>
            <a href="/match">Matching</a>
            <a href="/ranking">Ranking</a>
            <a href="/history">History</a>
            <a href="/logout" class="btn btn-secondary" style="padding: 6px 14px; font-size: 13px;">Logout</a>
        </nav>
    </header>

    <!-- WORKSPACE FORM -->
    <main class="section-wrapper" style="padding-top: 50px;">
        <div class="glass-panel form-container">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="badge-pill" style="margin-bottom: 12px;">RECRUITER WORKSPACE</div>
                <h1 class="text-gradient-cyan" style="font-size: 32px; font-weight: 800;">
                    ✏️ Edit Job Posting
                </h1>
                <p style="color: var(--text-secondary); font-size: 15px; margin-top: 8px;">
                    Update job specifications. SkillMatch AI will extract new skill profiles upon saving.
                </p>
            </div>

            <form action="/jobs/{{ job.id }}/edit" method="POST">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" name="job_title" class="form-control" value="{{ job.job_title }}" required>
                </div>

                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" name="company_name" class="form-control" value="{{ job.company_name }}" required>
                </div>

                <div class="form-group">
                    <label>Job Description & Technical Requirements</label>
                    <textarea name="job_description" class="form-control" required>{{ job.job_description }}</textarea>
                </div>

                <div style="display: flex; gap: 16px; justify-content: flex-end; align-items: center; margin-top: 30px;">
                    <a href="/jobs/{{ job.id }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2026 SkillMatch AI | AI Recruitment Intelligence Platform
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
